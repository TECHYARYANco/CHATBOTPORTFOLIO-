<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Bot — Techy Aryan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#2a2a2a;--accent:#ff6b35;--text:#f0f0f0;--muted:#888}
  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .wrapper{width:100%;max-width:480px}
  .chat-header{background:var(--surface);border:1px solid var(--border);border-bottom:none;border-radius:16px 16px 0 0;padding:18px 20px;display:flex;align-items:center;gap:14px}
  .bot-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff6b35,#ff9a6c);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 0 16px rgba(255,107,53,0.4)}
  .bot-info h3{font-size:15px;font-weight:600}
  .bot-info p{font-size:12px;color:var(--muted);margin-top:2px}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:6px;box-shadow:0 0 6px #22c55e;animation:pulse-dot 2s infinite}
  @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.5}}
  .powered{margin-left:auto;font-size:10px;color:var(--muted);background:var(--surface2);padding:4px 10px;border-radius:100px;border:1px solid var(--border);white-space:nowrap}
  .powered span{color:var(--accent);font-weight:600}
  .chat-window{background:var(--bg);border:1px solid var(--border);border-top:none;border-bottom:none;height:420px;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .chat-window::-webkit-scrollbar{width:4px}
  .chat-window::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .msg{display:flex;gap:10px;max-width:85%;animation:fadeUp 0.3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg-avatar{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px}
  .msg.user .msg-avatar{background:var(--accent)}
  .bubble{padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.55;color:var(--text)}
  .msg.bot .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
  .msg.user .bubble{background:var(--accent);border-bottom-right-radius:4px;color:#fff}
  .quick-replies{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 4px 38px;animation:fadeUp 0.3s ease}
  .qr-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:7px 14px;border-radius:100px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.2s,color 0.2s;white-space:nowrap}
  .qr-btn:hover{background:var(--accent);color:#fff}
  .typing{display:flex;align-items:center;gap:10px}
  .typing-dots{background:var(--surface);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;padding:12px 16px;display:flex;gap:5px;align-items:center}
  .typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
  .typing-dots span:nth-child(2){animation-delay:.2s}.typing-dots span:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  .chat-input{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 16px 16px;padding:14px 16px;display:flex;gap:10px;align-items:center}
  .chat-input input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s}
  .chat-input input:focus{border-color:var(--accent)}
  .chat-input input::placeholder{color:var(--muted)}
  .send-btn{width:40px;height:40px;background:var(--accent);border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:box-shadow 0.2s,transform 0.1s}
  .send-btn:hover{box-shadow:0 0 16px rgba(255,107,53,0.5);transform:scale(1.05)}
  .send-btn svg{width:18px;height:18px;fill:white}
  .brand-strip{text-align:center;margin-top:14px;font-size:12px;color:var(--muted)}
  .brand-strip a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrapper">
  <div class="chat-header">
    <div class="bot-avatar">🍽️</div>
    <div class="bot-info">
      <h3>Bella's Restaurant Assistant</h3>
      <p><span class="status-dot"></span>Online · Replies instantly</p>
    </div>
    <div class="powered">by <span>Techy Aryan</span></div>
  </div>
  <div class="chat-window" id="chatWindow"></div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Ask about menu, bookings, hours..."/>
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>
<div class="brand-strip">Powered by AI · Built by <a href="#">Techy Aryan</a></div>
<script>
const responses = {
  greeting: "Benvenuto! 🍝 Welcome to Bella's Restaurant! I'm your AI assistant. How can I help you today?",
  menu: "Our specialties include:\n🍝 Truffle Risotto — $28\n🦞 Lobster Linguine — $38\n🍕 Margherita Pizza — $18\n🍮 Tiramisu — $9\n\nAll handmade fresh daily! Would you like to make a reservation?",
  hours: "We're open:\n📅 Mon–Thu: 12pm–10pm\n📅 Fri–Sat: 12pm–11pm\n📅 Sunday: 1pm–9pm\n\nWould you like to book a table?",
  location: "📍 We're located at 42 Main Street, Downtown.\n\nFree on-site parking available! Would you like directions or to make a reservation?",
  reservation: "I'd love to help you book a table! 🎉\n\nPlease share:\n1️⃣ Date & time\n2️⃣ Number of guests\n3️⃣ Your name & phone\n\nI'll confirm your reservation right away!",
  dress: "We have a smart casual dress code 👔 — comfortable but presentable. No sportswear please!",
  parking: "✅ Free on-site parking is available for all our guests!",
  default: "Thanks for your message! 😊 Our team will get back to you shortly. Meanwhile, I can help with:\n\n📅 Reservations\n🍽️ Menu info\n🕐 Opening hours\n📍 Location & parking"
};

function getResponse(msg) {
  const m = msg.toLowerCase();
  if(m.match(/hi|hello|hey|start|help/)) return responses.greeting;
  if(m.match(/menu|food|dish|eat|pizza|pasta|risotto|special/)) return responses.menu;
  if(m.match(/hour|open|close|time|when/)) return responses.hours;
  if(m.match(/where|location|address|find|direction|map/)) return responses.location;
  if(m.match(/book|reserv|table|seat/)) return responses.reservation;
  if(m.match(/dress|wear|cloth|attire/)) return responses.dress;
  if(m.match(/park/)) return responses.parking;
  return responses.default;
}

function appendMessage(role, text) {
  const win = document.getElementById('chatWindow');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'bot' ? '🍽️' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.style.whiteSpace = 'pre-line';
  bubble.textContent = text;
  div.appendChild(avatar); div.appendChild(bubble);
  win.appendChild(div); win.scrollTop = win.scrollHeight;
}

function appendQuickReplies(options) {
  const win = document.getElementById('chatWindow');
  const div = document.createElement('div');
  div.className = 'quick-replies'; div.id = 'quickReplies';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn'; btn.textContent = opt;
    btn.onclick = () => { removeQuickReplies(); handleSend(opt); };
    div.appendChild(btn);
  });
  win.appendChild(div); win.scrollTop = win.scrollHeight;
}

function removeQuickReplies() { const qr = document.getElementById('quickReplies'); if(qr) qr.remove(); }

function showTyping() {
  const win = document.getElementById('chatWindow');
  const div = document.createElement('div');
  div.className = 'typing'; div.id = 'typingIndicator';
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar'; avatar.textContent = '🍽️';
  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  div.appendChild(avatar); div.appendChild(dots);
  win.appendChild(div); win.scrollTop = win.scrollHeight;
}

function hideTyping() { const t = document.getElementById('typingIndicator'); if(t) t.remove(); }

function handleSend(text) {
  const msg = text.trim(); if (!msg) return;
  removeQuickReplies();
  appendMessage('user', msg);
  showTyping();
  setTimeout(() => {
    hideTyping();
    appendMessage('bot', getResponse(msg));
    if(msg.match(/hi|hello|hey|start|help/i)) {
      setTimeout(() => appendQuickReplies(['📅 Make a reservation', '🍽️ See the menu', '🕐 Opening hours', '📍 Location & parking']), 300);
    }
  }, 1000 + Math.random() * 500);
}

function sendMessage() {
  const input = document.getElementById('userInput');
  const msg = input.value.trim(); if (!msg) return;
  input.value = ''; handleSend(msg);
}

document.getElementById('userInput').addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });

window.onload = () => {
  setTimeout(() => {
    appendMessage('bot', "Benvenuto! 🍝 Welcome to Bella's Restaurant! I'm your AI assistant. I can help with reservations, menu info, hours, and more!");
    setTimeout(() => appendQuickReplies(['📅 Make a reservation', '🍽️ See the menu', '🕐 Opening hours', '📍 Location & parking']), 500);
  }, 600);
};
</script>
</body>
</html>
