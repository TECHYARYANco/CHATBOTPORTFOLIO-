<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salon Bot — Techy Aryan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a080f;
    --surface: #110f18;
    --surface2: #1a1625;
    --border: #2a2440;
    --accent: #c084fc;
    --accent-glow: rgba(192,132,252,0.2);
    --text: #f0eeff;
    --muted: #8878aa;
    --bot-bubble: #1a1625;
  }
  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .wrapper { width: 100%; max-width: 480px; }
  .chat-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    padding: 18px 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .bot-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
    box-shadow: 0 0 20px rgba(168,85,247,0.4);
  }
  .bot-info h3 { font-size: 15px; font-weight: 600; }
  .bot-info p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; display: inline-block; margin-right: 6px;
    box-shadow: 0 0 6px #22c55e; animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .powered {
    margin-left: auto; font-size: 10px; color: var(--muted);
    background: var(--surface2); padding: 4px 10px;
    border-radius: 100px; border: 1px solid var(--border); white-space: nowrap;
  }
  .powered span { color: var(--accent); font-weight: 600; }
  .chat-window {
    background: var(--bg);
    border: 1px solid var(--border);
    border-top: none; border-bottom: none;
    height: 420px; overflow-y: auto;
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }
  .chat-window::-webkit-scrollbar { width: 4px; }
  .chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .msg { display: flex; gap: 10px; max-width: 85%; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0; margin-top: 2px;
  }
  .msg.user .msg-avatar { background: linear-gradient(135deg,#a855f7,#ec4899); }
  .bubble {
    padding: 11px 15px; border-radius: 16px;
    font-size: 14px; line-height: 1.55; color: var(--text);
  }
  .msg.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.user .bubble { background: linear-gradient(135deg,#a855f7,#ec4899); border-bottom-right-radius: 4px; color:#fff; }
  .quick-replies {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 4px 0 4px 38px; animation: fadeUp 0.3s ease;
  }
  .qr-btn {
    background: transparent; border: 1px solid var(--accent);
    color: var(--accent); padding: 7px 14px; border-radius: 100px;
    font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif;
    transition: background 0.2s, color 0.2s; white-space: nowrap;
  }
  .qr-btn:hover { background: var(--accent); color: #fff; }
  .typing { display: flex; align-items: center; gap: 10px; }
  .typing-dots {
    background: var(--bot-bubble); border: 1px solid var(--border);
    border-radius: 16px; border-bottom-left-radius: 4px;
    padding: 12px 16px; display: flex; gap: 5px; align-items: center;
  }
  .typing-dots span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2){animation-delay:.2s} .typing-dots span:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  .chat-input {
    background: var(--surface); border: 1px solid var(--border);
    border-top: none; border-radius: 0 0 16px 16px;
    padding: 14px 16px; display: flex; gap: 10px; align-items: center;
  }
  .chat-input input {
    flex:1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 16px; color: var(--text);
    font-family:'Inter',sans-serif; font-size:14px; outline:none; transition:border-color 0.2s;
  }
  .chat-input input:focus { border-color: var(--accent); }
  .chat-input input::placeholder { color: var(--muted); }
  .send-btn {
    width:40px; height:40px;
    background: linear-gradient(135deg,#a855f7,#ec4899);
    border:none; border-radius:10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: box-shadow 0.2s, transform 0.1s;
  }
  .send-btn:hover { box-shadow:0 0 16px rgba(168,85,247,0.5); transform:scale(1.05); }
  .send-btn svg { width:18px; height:18px; fill:white; }
  .brand-strip { text-align:center; margin-top:14px; font-size:12px; color:var(--muted); }
  .brand-strip a { color:var(--accent); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="chat-header">
    <div class="bot-avatar">💅</div>
    <div class="bot-info">
      <h3>Glam Studio Assistant</h3>
      <p><span class="status-dot"></span>Online · Book in seconds</p>
    </div>
    <div class="powered">by <span>Techy Aryan</span></div>
  </div>
  <div class="chat-window" id="chatWindow"></div>
  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Ask about services, bookings, prices..." />
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>
<div class="brand-strip">Powered by AI · Built by <a href="#">Techy Aryan</a></div>

<script>
const SYSTEM_PROMPT = `You are a friendly and stylish AI assistant for Glam Studio, a premium beauty salon.

About the salon:
- Name: Glam Studio
- Specialty: Hair, nails, skin, and beauty treatments
- Hours: Tue-Sat 9am-7pm, Sunday 10am-5pm, Monday closed
- Location: 18 Beauty Lane, Westside Mall
- Phone: +1 (555) 876-5432
- Booking: Via bot or call
- Services & Prices:
  * Haircut & Style: $45-$85
  * Hair Color (full): $120-$180
  * Highlights: $90-$140
  * Blowout: $35
  * Manicure: $25 | Pedicure: $35 | Gel nails: $45
  * Facial (basic): $60 | Deep cleansing facial: $85
  * Eyebrow threading: $15 | Waxing: $20-$60
- Top stylist: Sarah (hair), Lisa (nails), Emma (skin)
- Parking: Free in mall parking
- Cancellation: 24hr notice required

Your job:
- Help clients book appointments, check prices, learn about services
- Be warm, glamorous, and enthusiastic
- Keep responses short and helpful (2-4 lines max unless listing services)
- For bookings: collect service, date/time, stylist preference, name, phone
- Use beauty-relevant emojis ✨💅💇`;

const conversations = [];
let isTyping = false;

function appendMessage(role, text) {
  const win = document.getElementById('chatWindow');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'bot' ? '💅' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(avatar); div.appendChild(bubble);
  win.appendChild(div);
  win.scrollTop = win.scrollHeight;
}

function appendQuickReplies(options) {
  const win = document.getElementById('chatWindow');
  const div = document.createElement('div');
  div.className = 'quick-replies'; div.id = 'quickReplies';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn'; btn.textContent = opt;
    btn.onclick = () => { removeQuickReplies(); handleSend(opt); };
    div.appendChild(btn);
  });
  win.appendChild(div);
  win.scrollTop = win.scrollHeight;
}

function removeQuickReplies() {
  const qr = document.getElementById('quickReplies');
  if (qr) qr.remove();
}

function showTyping() {
  const win = document.getElementById('chatWindow');
  const div = document.createElement('div');
  div.className = 'typing'; div.id = 'typingIndicator';
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar'; avatar.textContent = '💅';
  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  div.appendChild(avatar); div.appendChild(dots);
  win.appendChild(div); win.scrollTop = win.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typingIndicator'); if(t) t.remove();
}

async function callClaude(msg) {
  conversations.push({ role:'user', content:msg });
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000, system:SYSTEM_PROMPT, messages:conversations })
  });
  const data = await res.json();
  const reply = data.content[0].text;
  conversations.push({ role:'assistant', content:reply });
  return reply;
}

async function handleSend(text) {
  if (isTyping) return;
  const msg = text.trim(); if (!msg) return;
  removeQuickReplies();
  appendMessage('user', msg);
  isTyping = true; showTyping();
  try {
    const reply = await callClaude(msg);
    hideTyping(); appendMessage('bot', reply);
  } catch(e) {
    hideTyping(); appendMessage('bot', 'Oops! Something went wrong. Please try again ✨');
  }
  isTyping = false;
}

function sendMessage() {
  const input = document.getElementById('userInput');
  const msg = input.value.trim(); if (!msg) return;
  input.value = ''; handleSend(msg);
}

document.getElementById('userInput').addEventListener('keydown', e => { if(e.key==='Enter') sendMessage(); });

window.onload = () => {
  setTimeout(() => {
    appendMessage('bot', `Hi gorgeous! ✨ Welcome to Glam Studio! I'm your personal beauty assistant. Ready to book an appointment or explore our services?`);
    setTimeout(() => {
      appendQuickReplies(['💇 Book appointment', '💅 Nail services', '💇‍♀️ Hair services', '💆 Skin & facials', '💰 View prices']);
    }, 400);
  }, 600);
};
</script>
</body>
</html>
